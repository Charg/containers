---
name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Plain upstream Nix: nothing here uses FlakeHub, and its login needs id-token: write,
          # which only the signing job should hold.
          determinate: false

      - name: Lint
        run: nix develop -c just lint

  changed:
    name: changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diffing against the base branch needs its history.
          fetch-depth: 0

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Plain upstream Nix: nothing here uses FlakeHub, and its login needs id-token: write,
          # which only the signing job should hold.
          determinate: false

      - name: List changed images
        id: changed
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: nix develop -c just changed "origin/${BASE_REF}"

  # One job per image and platform, so the arm64 cross-build runs alongside the amd64 build, test
  # and scan instead of after it.
  check:
    name: check ${{ matrix.image }} (${{ matrix.platform.arch }})
    needs: changed
    if: needs.changed.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changed.outputs.images) }}
        platform:
          # The runner's own platform: build, load, smoke-test and scan.
          - arch: amd64
            recipe: check
          # Cross-compiled on the same kind of runner, as a publish does: proves it builds.
          - arch: arm64
            recipe: build-all
    env:
      CACHE: gha
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Plain upstream Nix: nothing here uses FlakeHub, and its login needs id-token: write,
          # which only the signing job should hold.
          determinate: false

      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # BuildKit cache mounts (the cargo target dir) aren't in the layer cache. Keep them in the
      # Actions cache so a change above the compile step rebuilds only what changed. The key
      # follows the image's inputs: an exact hit means nothing new to save. A pull request reads
      # its own entries first, then main's, which release.yaml saves from clean publish builds.
      - name: Restore cache mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-mounts
          key: >-
            cache-mounts-${{ matrix.image }}-${{ matrix.platform.arch }}-${{
            hashFiles(format('images/{0}/**', matrix.image)) }}
          restore-keys: |
            cache-mounts-${{ matrix.image }}-${{ matrix.platform.arch }}-

      - name: Load cache mounts into the builder
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.platform.arch }}
        run: nix develop -c just cache-mounts import "${IMAGE}" "${ARCH}" "${RUNNER_TEMP}/cache-mounts"

      - name: Build (and on amd64 test and scan)
        env:
          IMAGE: ${{ matrix.image }}
          RECIPE: ${{ matrix.platform.recipe }}
          PLATFORMS: linux/${{ matrix.platform.arch }}
        run: nix develop -c just "${RECIPE}" "${IMAGE}"

      # actions/cache saves the directory when the job ends, if the key wasn't an exact hit.
      - name: Save cache mounts from the builder
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.platform.arch }}
        run: nix develop -c just cache-mounts export "${IMAGE}" "${ARCH}" "${RUNNER_TEMP}/cache-mounts"

  # Single required status for the branch ruleset: passes when every image check passed or
  # there was nothing to check.
  ci:
    name: ci
    if: always()
    needs: [lint, changed, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "a required job ended with: ${result}" >&2; exit 1 ;;
            esac
          done
