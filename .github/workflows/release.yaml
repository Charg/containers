---
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  # Queue rather than cancel: a signed push half-way through must run to completion, not be
  # killed mid-digest by a second push to main.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry only answers a definitive 404 for an unpublished image to a token that
      # can read packages; an anonymous query gets a 403 the plan treats as ambiguous.
      packages: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Plain upstream Nix: nothing here uses FlakeHub, and its login needs id-token: write,
          # which only the signing job should hold.
          determinate: false

      - name: Decide which images need publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c just plan

  publish:
    name: publish ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.images != '' && needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      CACHE: gha
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Plain upstream Nix: nothing here uses FlakeHub, and its login needs id-token: write,
          # which only the signing job should hold.
          determinate: false

      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c hack/registry-login.sh

      - name: Build, push, sign, verify and attest vulnerabilities
        id: publish
        env:
          IMAGE: ${{ matrix.image }}
          # Read access to check the immutable tag; an anonymous query can't tell 404 from 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c just publish "${IMAGE}"

      # Seed the cache-mounts entries pull requests restore from (see ci.yaml), from this clean
      # build. The image is already published, so a failure here doesn't fail the job.
      - name: Export cache mounts
        id: mounts
        if: steps.publish.outputs.digest != ''
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          nix develop -c just cache-mounts export "${IMAGE}" amd64 "${RUNNER_TEMP}/cache-mounts/amd64"
          nix develop -c just cache-mounts export "${IMAGE}" arm64 "${RUNNER_TEMP}/cache-mounts/arm64"

      - name: Save amd64 cache mounts
        if: steps.mounts.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-mounts/amd64
          key: cache-mounts-${{ matrix.image }}-amd64-${{ hashFiles(format('images/{0}/**', matrix.image)) }}

      - name: Save arm64 cache mounts
        if: steps.mounts.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-mounts/arm64
          key: cache-mounts-${{ matrix.image }}-arm64-${{ hashFiles(format('images/{0}/**', matrix.image)) }}

      - name: Attest build provenance
        # Run even if the public-pull check failed: the image is already pushed and signed.
        if: always() && steps.publish.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.ref }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
